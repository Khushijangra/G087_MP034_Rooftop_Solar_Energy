apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp034-api
  labels:
    app: mp034-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp034-api
  template:
    metadata:
      labels:
        app: mp034-api
    spec:
      containers:
      - name: mp034-api
        image: mp034-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
